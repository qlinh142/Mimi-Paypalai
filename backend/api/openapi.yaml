openapi: 3.1.0
info:
  title: Mimi API
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  version: 0.2.0
  description: |
    API của Mimi V2 (backend Go trên Cloud Run, gọi qua Firebase Hosting tại /api).

    Quy ước chung:
    - Tiền là số nguyên đồng (VND). Mọi con số do server tính; client chỉ hiển thị.
    - Ngày là chuỗi YYYY-MM-DD theo múi giờ của người dùng.
    - Lỗi luôn có dạng Error với `code` ổn định; client dựa vào `code`, không dựa vào `message`.
    - Thao tác ghi có thể gửi lại an toàn: hóa đơn dùng `receipt_id` do client sinh,
      sửa tồn dùng `acted_at`, các thao tác còn lại là PUT/DELETE theo khóa cố định.
    - Header `Idempotency-Key` (8–128 ký tự `A-Za-z0-9_-`, thường là UUID sinh lúc người dùng bấm)
      cho mọi thao tác ghi gửi JSON. Gửi lại cùng key và cùng nội dung trong 24 giờ thì nhận lại
      đúng kết quả lần đầu, kèm header `Idempotent-Replayed: true`, máy chủ không ghi lần hai.
      Cùng key nhưng khác route hoặc khác nội dung: 422 `idempotency_mismatch`. Cùng key đang
      xử lý dở: 409 `idempotency_in_flight` (retryable). Lỗi tạm thời không được giữ theo key.
    - Thành viên nhà (role=member) không bao giờ nhận trường giá hay chi tiêu.
    - Mục `x-status: planned` là endpoint đã thiết kế nhưng khung server trả 501.
servers:
  - url: /api
security:
  - firebaseIdToken: []
    appCheck: []

tags:
  - { name: system, description: Sức khỏe dịch vụ }
  - { name: me, description: "Đăng nhập, Cài đặt, Quyền riêng tư (spec mục 1, 6)" }
  - { name: home, description: Trang chủ (spec mục 2) }
  - { name: ai, description: "Hỏi Mimi trên màn Phân tích chi tiêu (AG Studio)" }
  - { name: receipts, description: "Quét, Xác nhận, Đã lưu" }
  - { name: items, description: "Đồ dùng, Chi tiết món, Cần mua (spec mục 4, 5)" }
  - { name: spending, description: "Sổ chi tiêu, Dự báo 30 ngày, Khoản chi định kỳ (spec mục 3)" }
  - { name: plan, description: "Kế hoạch mua sắm, Giỏ, Giá tốt (spec mục 5)" }
  - { name: household, description: "Nhà mình, lời nhờ mua (spec mục 6)" }
  - { name: online, description: "Mimi Online: Household Mandate, PayPal, giao hàng, Verify, Refund (Mimi 2.0 mục 12 đến 19)" }

paths:
  /healthz:
    get:
      tags: [system]
      security: []
      summary: Tiến trình còn sống
      responses: { "200": { description: OK } }
  /readyz:
    get:
      tags: [system]
      security: []
      summary: Sẵn sàng phục vụ (đọc thử Firestore, không gọi Gemini)
      responses: { "200": { description: Ready }, "503": { description: Not ready } }
  /health:
    get:
      tags: [system]
      security: []
      summary: Như /healthz. Dùng khi gọi qua URL công khai của Cloud Run, nơi /healthz bị Google Frontend chặn
      responses: { "200": { description: OK } }
  /ready:
    get:
      tags: [system]
      security: []
      summary: Như /readyz
      responses: { "200": { description: Ready }, "503": { description: Not ready } }

  # ---------------- Me & cài đặt ----------------
  /me:
    get:
      tags: [me]
      summary: Hồ sơ, vai trò, cài đặt
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [me]
      summary: Xóa hết dữ liệu của mình
      description: |
        B10. Chủ nhà: mời từng người ra (vòng mua hộ còn mở bị hủy, món trả về kế hoạch người nhờ) rồi
        xóa nhà; thành viên: rời nhà. Sau đó xóa đệ quy users/{uid}, rồi xóa tài khoản Auth sau cùng.
        Gọi lại sau khi lỗi giữa chừng sẽ chạy tiếp (idempotent), nên không giữ kết quả theo Idempotency-Key.
        Token phải chưa bị thu hồi và của lần đăng nhập trong 5 phút gần nhất; không thì 403
        reauth_required: app cho người dùng đăng nhập lại (Google hoặc link email) rồi gọi lại.
      responses:
        "204": { description: Đã xóa }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "reauth_required: cần đăng nhập lại", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /settings:
    put:
      tags: [me]
      summary: Cập nhật cài đặt (lead_days 1..30, nhắc, tin sale, ngôn ngữ dịch)
      description: |
        Chỉ gửi các trường muốn đổi; trường vắng mặt giữ nguyên. Trường lạ trả 400 bad_request.
        Đổi remind_enabled, digest_time hoặc timezone thì server tính lại lượt gửi bản tin kế tiếp.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
      responses:
        "200": { description: Cài đặt sau khi lưu, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "422": { description: "validation_failed, fields.field là trường sai", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /home:
    get:
      tags: [home]
      summary: Số phụ của 4 ô Trang chủ trong một lần gọi
      description: |
        needs_count dùng cùng quy tắc với tab "Sắp hết" khoảng 7 ngày của màn Đồ dùng.
        Thành viên nhà luôn nhận spent_this_month = null và plan rỗng (không thấy chi tiêu của chủ nhà).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HomeSummary" } } } }
  /notifications:
    get:
      tags: [home]
      summary: Thông báo trong nhà (đã lưu, có đã đọc) và thông báo suy ra lúc đọc
      description: |
        B9: sự kiện giữa người trong nhà đứng đầu (kind=event, 30 ngày gần nhất): plan_sent, plan_updated,
        plan_cancelled (gửi người mua), run_done, run_declined, plan_split (gửi người nhờ). Sự kiện được ghi
        cùng transaction với thay đổi, rồi đẩy vào hàng đợi Cloud Tasks "notify" để worker gửi thư.
        Chủ giỏ: chuyến mua hẹn hôm nay hoặc ngày mai khi giỏ còn món (kind=trip), rồi các món trong
        "Cần mua" 7 ngày (kind=item). Thành viên nhà: chỉ món sắp hết của nhà, không có giá hay chuyến mua.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [event, item, trip] }
                        item_key: { type: string }
                        name: { type: string }
                        status: { $ref: "#/components/schemas/StockStatus" }
                        days_left: { type: [integer, "null"] }
                        date: { type: string, format: date }
                        hour: { type: [integer, "null"] }
                        item_count: { type: integer }
                        event:
                          type: object
                          description: "Chỉ có khi kind=event. Không có giá tiền."
                          properties:
                            id: { type: string }
                            kind: { type: string, enum: [plan_sent, plan_updated, plan_cancelled, run_done, run_declined, plan_split] }
                            at: { type: string, format: date-time }
                            actor_name: { type: string }
                            plan_id: { type: string }
                            plan_name: { type: string, description: "Đọc lúc trả về; rỗng là Kế hoạch chính" }
                            assignment_id: { type: string }
                            items: { type: integer }
                            returned: { type: integer }
                            read: { type: boolean }
  /notifications/{id}/read:
    post:
      tags: [home]
      summary: "B9: đánh dấu một thông báo sự kiện đã đọc (id dạng event:...)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Đã đánh dấu }
        "404": { description: Không phải thông báo sự kiện, hoặc không còn }

  # ---------------- Hóa đơn ----------------
  /receipts/read:
    post:
      tags: [receipts]
      summary: Đọc ảnh của một hóa đơn, trả bản nháp (không lưu ảnh)
      description: |
        Tối đa 8 ảnh, mỗi ảnh tối đa 4 MiB (đã nén ở máy). Trừ 1 lượt trong quota 20 hóa đơn/ngày
        chỉ khi đọc thành công. Gửi lại cùng receipt_id trong vòng 1 giờ trả bản nháp cũ, không gọi lại AI.
        Thời gian xử lý tối đa 55 giây.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [receipt_id, images]
              properties:
                receipt_id: { $ref: "#/components/schemas/ClientId" }
                lang: { type: string, enum: [vi, en], default: vi }
                images: { type: array, maxItems: 8, items: { type: string, format: binary } }
      responses:
        "200": { description: Bản nháp, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { description: "receipt_unreadable hoặc validation_failed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "quota_exceeded (fields.limit) hoặc rate_limited", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: ai_unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /receipts:
    post:
      tags: [receipts]
      summary: Lưu hóa đơn đã xác nhận (đường ghi duy nhất đổi tồn kho và chi tiêu)
      description: |
        Server tính lại mọi con số. Ghi trong một transaction: receipt, purchases, items của các nhóm,
        months, plan_items khớp nhóm chuyển done, lời nhờ mua khớp nhóm đóng lại, receipt_count.
        Cùng receipt_id và cùng nội dung: 200 replayed=true. Khác nội dung: 409 receipt_conflict.
        Giống hóa đơn đã có (cửa hàng, ngày, tổng): 409 possible_duplicate, gửi lại với confirm_duplicate=true.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SaveReceipt" } } } }
      responses:
        "201": { description: Đã lưu, content: { application/json: { schema: { $ref: "#/components/schemas/SaveResult" } } } }
        "200": { description: "Gửi lại, kết quả cũ", content: { application/json: { schema: { $ref: "#/components/schemas/SaveResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [receipts]
      x-status: planned
      summary: Lịch sử hóa đơn (phân trang theo con trỏ)
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { "200": { description: OK } }
  /receipts/history:
    get:
      tags: [receipts]
      summary: "Spec 1.5 mục 4 (màn 4c): Lịch sử mua hàng mọi tháng, mới nhất trước"
      description: |
        Gồm hóa đơn tự lưu (kind own, tối đa 500), phần món người nhà mua hộ (kind delegated, receipt_id
        dạng d-{mã hóa đơn của người mua}, chỉ các món của mình) và khoản định kỳ trả tay (kind recurring).
        Món chưa rõ giá không nằm trong total_vnd, đếm ở missing_price. buyer_uid để app hiện tên gọi đã đặt.
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { receipts: { type: array, items: { $ref: "#/components/schemas/HistoryReceipt" } } } } } } } }
  /receipts/{id}:
    get:
      tags: [receipts]
      summary: "Spec 1.5 mục 4 (màn 4d): Chi tiết hóa đơn, kèm phần chia khi có món mua hộ"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReceiptDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /receipts/{id}/lines/{lineId}:
    patch:
      tags: [receipts]
      x-status: planned
      summary: Sửa sau khi lưu, chỉ cờ habit và nhóm hàng của một dòng (tính lại tồn, không đổi tiền)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ClientId" } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                habit: { type: boolean }
                category_key: { type: string }
      responses: { "200": { description: OK } }

  # ---------------- Đồ dùng ----------------
  /items:
    get:
      tags: [items]
      summary: Danh sách món (chủ giỏ)
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [soon, active], default: active } }
        - { name: horizon, in: query, schema: { type: integer, enum: [3, 7, 14], default: 7 } }
        - { name: q, in: query, description: Tìm không dấu, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Item" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /items/{key}:
    get:
      tags: [items]
      summary: Chi tiết món, kèm tối đa 10 lần mua gần nhất (truy vấn purchases, không lưu bản sao)
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemDetail" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [items]
      summary: Sửa tên chuẩn hóa hoặc chuyển món sang nhóm đúng (0.1 mục 3.2)
      description: >
        group_key khác key hiện tại thì mọi lần mua chuyển sang nhóm mới (số liệu giữ nguyên),
        tồn còn lại gộp vào nhóm mới theo từng chiều đo, ghi classification_corrections và xóa
        món cũ. Phản hồi là món ở key mới.
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 60 }
                group_key: { type: string, description: "Khóa nhóm taxonomy 0.2" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /items/{key}/stock:
    patch:
      tags: [items]
      summary: Còn nhiều / Sắp hết / Đã hết hoặc nhập 1..60 ngày
      description: Thao tác cũ hơn bản sửa đang có (hàng đợi offline gửi muộn) không ghi đè, trả trạng thái hiện tại.
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StockChange" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /items/{key}/override:
    delete:
      tags: [items]
      summary: Hoàn tác bản sửa tay (không gửi cả tài liệu món)
      parameters:
        - { $ref: "#/components/parameters/ItemKey" }
        - { name: acted_at, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
  /items/{key}/quantity:
    put:
      tags: [items]
      summary: SET số lượng thật đang có (Confirmed Inventory, nguồn manual)
      description: Đơn vị được quy về g, ml hoặc cái. Estimated Inventory tính lại từ mốc này.
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [qty]
              properties:
                qty: { type: number, minimum: 0 }
                unit: { type: string, description: "kg, g, l, ml, cái, hộp, gói, chai, quả…" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /items/{key}/price-history:
    get:
      tags: [items]
      summary: "8.1 mục 14.1: giá gần nhất, thấp nhất, trung bình theo đơn giá chuẩn hóa (đ / g, ml, m, item)"
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemPriceHistory" } } } } }
  /items/market-prices:
    get:
      tags: [items]
      summary: "Mimi 2.2: giá chung của mọi món đang theo dõi, cho dòng Rẻ nhất trên thẻ món. Chỉ món đã có giá."
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ItemMarketPrices" } } } } } }
  /items/{key}/market-prices:
    get:
      tags: [items]
      summary: "Mimi 2.2: giá đang bán của một món (bảng giá chung, nước của người dùng), cho mục So sánh giá trong Chi tiết món"
      description: Bảng giá lấy mọi món từng có trong tồn kho, hóa đơn, kế hoạch của mọi tài khoản (anh chốt 09/11). updated_at null khi món chưa được tra lần nào.
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ItemMarketPrices" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /needs:
    get:
      tags: [items]
      x-status: planned
      summary: Cần mua (cùng quy tắc với số trên ô Trang chủ)
      parameters: [{ name: horizon, in: query, schema: { type: integer, enum: [3, 7, 14], default: 7 } }]
      responses: { "200": { description: OK } }

  # ---------------- Chi tiêu ----------------
  /spending:
    get:
      tags: [spending]
      summary: Sổ chi tiêu theo tháng (chỉ chủ giỏ)
      parameters: [{ name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Spending" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /forecast:
    get:
      tags: [spending]
      summary: Dự báo 30 ngày (2.1 mục 7) = kỳ định kỳ pending trong cửa sổ (kể cả quá hạn) + món dự đoán hết theo giá đã trả gần nhất
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Forecast" } } } } }
  /recurring:
    get:
      tags: [spending]
      summary: Khoản định kỳ, kỳ đang chờ (current), lịch sử kỳ và trạng thái hiển thị
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringList" } } } } }
    post:
      tags: [spending]
      summary: Thêm khoản định kỳ; tạo luôn kỳ pending đầu tiên (không cộng Spending)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Recurring" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /recurring/{id}:
    patch:
      tags: [spending]
      summary: Sửa khoản (chỉ gửi trường đổi). Đổi hạn thì thay kỳ pending hiện tại.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Recurring" } } } }, "404": { $ref: "#/components/responses/Error" } }
    delete: { tags: [spending], summary: "Xóa khoản và các kỳ pending (kỳ đã paid / matched giữ làm lịch sử)", parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Deleted } } }
  /recurring/occurrences/{id}/pay:
    post:
      tags: [spending]
      summary: "Rule R2: xác nhận đã trả; cộng Spending tháng trả, rời Forecast, tạo kỳ sau"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { paid_at: { type: string, format: date } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Occurrence" } } } }
        "409": { description: "invalid_state: kỳ đã xử lý", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /recurring/occurrences/{id}/skip:
    post:
      tags: [spending]
      summary: Kỳ này không phát sinh; không cộng Spending, tạo kỳ sau
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Occurrence" } } } } }
  /recurring/scan:
    post:
      tags: [spending]
      x-status: planned
      summary: Đọc hóa đơn thanh toán dịch vụ (nhà cung cấp, số tiền, hạn); không lưu cho tới khi người dùng chọn Lưu
      responses: { "200": { description: OK } }

  # ---------------- Kế hoạch ----------------
  /plan:
    get:
      tags: [plan]
      summary: Giỏ đang mở, tồn hiện tại và giá rẻ nhất đã biết của từng món, ước tính, thông tin chuyến mua
      description: |
        Giá là giá mỗi đơn vị người dùng từng trả (từ hóa đơn đã lưu, chỉ dòng "dùng để dự đoán").
        estimate theo phương án khuyên dùng của /plan/prices; món chưa có giá đếm ở missing_price, không cộng vào.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /plan/items/{key}:
    put:
      tags: [plan]
      summary: Cho món vào giỏ (một dòng mở mỗi nhóm, gọi lại không tạo thêm dòng)
      description: |
        Món trong Đồ dùng: không cần thân. Món chưa từng mua (3.1 mục 3A.4): key là group key của taxonomy
        (GET /taxonomy) hoặc "custom-..." kèm name. Mọi route /plan/... nhận ?plan_id= (mặc định "default").
      parameters: [{ $ref: "#/components/parameters/ItemKey" }, { $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 60 }
                qty: { type: number, exclusiveMinimum: 0, maximum: 10000 }
                unit: { type: string }
                category_key: { type: string }
      responses:
        "200": { description: Giỏ sau khi thêm, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { description: "Giỏ đã đủ 100 món (fields.limit)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [plan]
      summary: Sửa số lượng, đơn vị, ngày cần, ưu tiên, lý do của dòng đang mở (chỉ gửi trường thay đổi)
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                qty: { type: number, exclusiveMinimum: 0, maximum: 10000 }
                unit: { type: string }
                need_by: { type: string, description: "YYYY-MM-DD, từ hôm qua đến 366 ngày tới; chuỗi rỗng để bỏ" }
                priority: { type: string, enum: [high, normal, low] }
                reason: { type: string, maxLength: 120 }
      responses:
        "200": { description: Giỏ sau khi sửa, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [plan]
      summary: Bỏ món khỏi giỏ (món không có trong giỏ vẫn trả 204)
      parameters: [{ $ref: "#/components/parameters/ItemKey" }]
      responses: { "204": { description: Deleted } }
  /plan/state:
    put:
      tags: [plan]
      summary: Ngày, giờ và ghi chú cho chuyến mua
      description: >-
        Gửi base_rev là rev đọc được trong Cart.state. Nếu máy khác đã lưu sau đó, trả 409 conflict
        (details.rev là rev hiện tại) và không ghi gì; client tải lại kế hoạch rồi cho người dùng sửa lại.
        Không gửi base_rev thì ghi đè như cũ.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanState" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanState" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /plan/prices:
    get:
      tags: [plan]
      summary: Nơi mua tối ưu (một hàm tính chung cho Giỏ, Giá tốt và ô Trang chủ)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanPrices" } } } } }

  /plan/price-history:
    get:
      tags: [plan]
      summary: "8.1 mục 14.2: ước tính giỏ theo đơn giá chuẩn hóa đã trả (90 ngày), độ phủ từng nơi, phương án chia nơi"
      description: Một nơi chỉ có estimated_total khi có giá cho mọi món. Xếp hạng theo độ phủ, rồi tổng, rồi độ mới.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BasketPrices" } } } } }
  /plan/market-prices:
    get:
      tags: [plan]
      summary: "ADR-004: giá đang bán của các món trong Kế hoạch, đọc từ bảng giá chung (chỉ nguồn công khai)"
      description: Chỉ trả món đã có giá. Món mới thêm có giá sau lượt price-sync 2 giờ sáng. Giá trên hóa đơn của nhà mình không nằm ở đây.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPrices" } } } } }
  /plan/market-prices/refresh:
    post:
      tags: [plan]
      summary: "Nút Cập nhật giá: tra lại giá các món trong Kế hoạch, không chờ job đêm"
      description: Bỏ qua món đã tra trong 24 giờ, tối đa 12 món mỗi lần, 3 lần mỗi người mỗi ngày (mẹ chốt 02/11). Không có món nào cần tra thì không tốn lượt.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MarketRefresh" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /ai/turn:
    post:
      tags: [ai]
      summary: "Hỏi Mimi (màn Phân tích chi tiêu, AG Studio): một lượt Gemini"
      description: >-
        App giữ vòng lặp agent của AG Studio và tự chạy mọi tool; máy chủ chỉ gọi Gemini (Vertex AI) một lượt với
        hội thoại và khai báo tool app gửi lên, rồi trả lời văn bản hoặc lời đề nghị gọi tool. Dạng tin nhắn theo REST
        của Gemini. Giới hạn lượt mỗi người mỗi ngày (AI_DAILY_LIMIT).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiTurnRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AiTurnResponse" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /plan/delegated:
    get:
      tags: [plan, household]
      summary: "4.1 mục 9.2: vòng mua hộ được giao cho tôi (to_me, còn mở; to_me_done, đã mua xong) và vòng tôi đã gửi (from_me)"
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Delegated" } } } } }
  /plans:
    get:
      tags: [plan]
      summary: "3.1 mục 3A: Plan mặc định và các Plan đặt tên"
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { plans: { type: array, items: { $ref: "#/components/schemas/PlanMeta" } } } } } } } }
    post:
      tags: [plan]
      summary: Tạo Plan đặt tên (tối đa 10 Plan đang dùng)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PlanMeta" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /plans/{id}:
    patch:
      tags: [plan]
      summary: "Đổi tên, lưu trữ (archived chặn ghi) hoặc đổi biểu tượng; id=default chỉ đổi được icon"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanMeta" } } } } }
    delete:
      tags: [plan]
      summary: Xóa Plan và các dòng; bị chặn (invalid_state) khi có món đang nhờ mua
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/Error" } }
  /taxonomy:
    get:
      tags: [items]
      summary: "0.2: bộ nhóm sản phẩm dùng chung (key canonical, nhãn vi/en, chiều đo, đơn vị); ?q= tìm không dấu"
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [vi, en] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses: { "200": { description: OK } }

  /fx/rates:
    get:
      tags: [items]
      summary: "Tỷ giá từng ngày (số đồng cho 1 đơn vị ngoại tệ) để app quy đổi sang tiền tệ hiển thị theo ngày mua"
      description: |
        Trả các ngày có tỷ giá trong [from, to], cũ trước, kèm một ngày gần nhất trước from (ngày chưa có
        tỷ giá dùng tỷ giá gần nhất trước đó). Vắng to: hôm nay; vắng from: to lùi 800 ngày.
      parameters:
        - { name: currency, in: query, required: true, schema: { type: string, example: USD } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [currency, rates]
                properties:
                  currency: { type: string }
                  rates:
                    type: array
                    items:
                      type: object
                      required: [on, rate]
                      properties:
                        on: { type: string, format: date }
                        rate: { type: string, description: "Số đồng cho 1 đơn vị, thập phân" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------- Mimi Online ----------------
  # Chỉ đăng ký khi PAYPAL_MODE khác off. Payment không đổi tồn kho; chỉ Verify mới cộng Confirmed Inventory.
  /mandate:
    get:
      tags: [online]
      summary: Household Mandate hiện tại (mặc định chưa bật)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Mandate" } } } } }
    put:
      tags: [online]
      summary: Lưu Household Mandate (chỉ chủ nhà)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Mandate" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Mandate" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /orders/basket:
    post:
      tags: [online]
      summary: Dựng giỏ online từ các dòng Kế hoạch và đánh giá Mandate (ALLOW / ASK / BLOCK). Không tạo giao dịch.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderKeys" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Basket" } } } }
  /orders:
    get:
      tags: [online]
      summary: Đơn online gần nhất
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { orders: { type: array, items: { $ref: "#/components/schemas/Order" } } } } } }
    post:
      tags: [online]
      summary: Checkout, tạo PayPal order (intent CAPTURE, tính bằng USD theo PAYPAL_VND_PER_USD)
      description: BLOCK trả 403 mandate_blocked; ASK chưa có approve=true trả 409 approval_required.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/OrderKeys"
                - type: object
                  properties:
                    approve: { type: boolean, description: Người dùng duyệt các ngoại lệ ASK }
                    provider: { type: string, enum: [paypal, braintree], description: "Cổng thanh toán; mặc định paypal. braintree: trả bằng thẻ, thu tiền ở /orders/{id}/card" }
      responses:
        "201": { description: "Đơn ở trạng thái awaiting_payment; PayPal kèm paypal_order_id và approve_url", content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      tags: [online]
      summary: Một đơn
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /orders/{id}/capture:
    post:
      tags: [online]
      summary: Capture sau khi người dùng duyệt trên PayPal. Gọi lại an toàn. Ghi Spending (online_vnd), không cộng tồn kho.
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200": { description: Đơn paid, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "402": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /orders/card-token:
    post:
      tags: [online]
      summary: Client token Braintree cho Drop-in UI (trả bằng thẻ). Chế độ giả lập trả "fake-client-token".
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [client_token], properties: { client_token: { type: string } } } } }
        "503": { $ref: "#/components/responses/Error" }
  /orders/{id}/card:
    post:
      tags: [online]
      summary: Thu tiền đơn braintree bằng nonce Drop-in trả về. Gọi lại an toàn. Ghi Spending, không cộng tồn kho.
      description: Số thẻ không qua server Mimi; Drop-in gửi thẳng cho Braintree và trả nonce dùng một lần.
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [nonce], properties: { nonce: { type: string, maxLength: 512 } } } } }
      responses:
        "200": { description: Đơn paid, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "402": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /webhooks/braintree:
    post:
      tags: [online]
      security: []
      summary: Webhook Braintree (settle, từ chối quyết toán, khiếu nại). Tin nhờ chữ ký bt_signature, không cần token.
      description: Chỉ ghi card_status vào đơn thẻ; không đổi bước giao hàng hay Spending. Thông báo không khớp đơn nào vẫn trả 200.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [bt_signature, bt_payload], properties: { bt_signature: { type: string }, bt_payload: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /orders/{id}/advance:
    post:
      tags: [online]
      summary: "Cửa hàng sandbox: mô phỏng bước giao kế tiếp (paid → ordered → shipped → delivered)"
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}/delivery/read:
    post:
      tags: [online]
      summary: Gemini đếm món trong 1 đến 4 ảnh hàng nhận được; chỉ gợi ý, người dùng xác nhận ở /verify
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { images: { type: array, maxItems: 4, items: { type: string, format: binary } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, properties: { key: { type: string }, qty: { type: number }, confidence: { type: string, enum: [low, mid, high] } } }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}/verify:
    post:
      tags: [online]
      summary: Xác nhận số gói nhận được; chỉ lượng này vào Confirmed Inventory và reconcile Kế hoạch
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actual]
              properties: { actual: { type: object, additionalProperties: { type: number, minimum: 0 }, description: "key → số gói nhận được" } }
      responses:
        "200": { description: Đơn verified, kèm suggested_refund_vnd, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /orders/{id}/refund:
    post:
      tags: [online]
      summary: Refund một phần hoặc toàn bộ qua PayPal; giữ lịch sử trong payments/{id}.refunds và trừ Spending
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, amount_vnd]
              properties:
                reason: { type: string, enum: [missing, wrong, damaged, other] }
                amount_vnd: { $ref: "#/components/schemas/Vnd" }
                note: { type: string, maxLength: 200 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "402": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---------------- Nhà mình ----------------
  /households:
    get: { tags: [household], summary: "Nhà của tôi, thành viên, vai trò; mã mời còn hạn (chỉ chủ nhà)", responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Household" } } } } } }
    patch:
      tags: [household]
      summary: Đổi tên nhà (chủ nhà); nhà một người được tạo khi đặt tên
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 40 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Household" } } } } }
  /households/invites:
    post:
      tags: [household]
      summary: Tạo mã nhà 8 ký tự, cố định không hết hạn. Gọi lại là đổi mã, mã cũ hết hiệu lực
      responses: { "201": { description: Created, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } } }
  /households/join:
    post:
      tags: [household]
      summary: Vào nhà bằng mã mời (tối đa 8 người); đang ở nhà khác có người thì phải rời trước
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Household" } } } }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /households/leave:
    post: { tags: [household], summary: "Rời nhà; vòng mua hộ còn mở có mình bị hủy, món trả về Owner", responses: { "204": { description: Left } } }
  /households/members/{uid}:
    delete: { tags: [household], summary: Chủ nhà xóa thành viên, parameters: [{ name: uid, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Removed } } }
  /households/shopping-assignments:
    post:
      tags: [household]
      summary: "4.1 mục 9.1: gửi các món của một Plan cho một thành viên cùng nhà (dòng Plan → assigned)"
      description: |
        B5: mỗi Plan chỉ có một bản đã gửi. Plan đang gửi cho cùng người thì lần gửi này ghi đè bản đó
        (keys là cả danh sách muốn gửi; món bị bỏ trả về open, món đã mua giữ nguyên, updated_at đổi).
        Gửi cho người khác thì bản cũ bị hủy trước. Vòng đã xong thì tạo vòng mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer_uid, keys]
              properties:
                buyer_uid: { type: string }
                plan_id: { type: string }
                keys: { type: array, maxItems: 60, items: { type: string } }
                note: { type: string, maxLength: 120 }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Assignment" } } } }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /households/shopping-assignments/{id}/cancel:
    post:
      tags: [household]
      summary: "Case 4: Owner hủy vòng còn mở; món chưa mua trả về open"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Assignment" } } } } }
  /households/shopping-assignments/{id}/complete:
    post:
      tags: [household]
      summary: "Spec 1.5 mục 2: người được nhờ bấm Mua hàng xong"
      description: |
        Ghi các món đã tick thành một hóa đơn của người mua (mã run-{id}, gửi lại không ghi trùng), qua cùng đường
        với POST /receipts có assignment_id: món nhờ mua đã tick thành done và vào tồn kho người nhờ, món chưa tick trả về
        Kế hoạch của người nhờ, món mine vào tồn kho người mua. price null là chưa rõ giá. Không tick món nào: closed_partial.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scanned: { type: boolean }
                note: { type: string, maxLength: 200 }
                store: { type: string }
                lines:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      key: { type: string }
                      name: { type: string }
                      qty: { type: number }
                      unit: { type: string }
                      price: { type: [number, "null"], description: "Đơn giá VND; null là chưa rõ giá" }
                      ticked: { type: boolean }
                      mine: { type: boolean }
                      category: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Assignment" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /households/shopping-assignments/{id}/decline:
    post:
      tags: [household]
      summary: "Spec 1.5 câu 5: người được nhờ từ chối; mọi món trả về Kế hoạch của người nhờ (status declined)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Assignment" } } } } }
  /households/needs:
    get:
      tags: [household]
      summary: Món sắp hết của nhà cho thành viên (không có giá)
      parameters: [{ name: horizon, in: query, schema: { type: integer, enum: [3, 7, 14], default: 7 } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SharedItem" } } } }
  /households/asks:
    post: { tags: [household], x-status: planned, summary: "Nhờ người nhà mua (chỉ tên món, không giá)", responses: { "201": { description: Created } } }
  /households/asks/{id}/bought:
    post: { tags: [household], x-status: planned, summary: Người nhận báo đã mua, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }

components:
  securitySchemes:
    firebaseIdToken: { type: http, scheme: bearer, bearerFormat: Firebase ID token }
    appCheck: { type: apiKey, in: header, name: X-Firebase-AppCheck }

  parameters:
    ItemKey:
      name: key
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ClientId" }
    PlanId:
      name: plan_id
      in: query
      required: false
      schema: { type: string, default: default }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^o-[0-9a-f]{16}$" }

  responses:
    Error:
      description: Lỗi có mã ổn định
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    AiPart:
      type: object
      description: Một phần tin nhắn. Có đúng một trong text, functionCall, functionResponse.
      properties:
        text: { type: string }
        thoughtSignature: { type: string, description: "Chữ ký Gemini 3 (base64) của lượt gọi tool, gửi trả nguyên vẹn" }
        functionCall:
          type: object
          required: [name]
          properties: { id: { type: string }, name: { type: string }, args: { type: object, additionalProperties: true } }
        functionResponse:
          type: object
          required: [name, response]
          properties: { id: { type: string }, name: { type: string }, response: { type: object, additionalProperties: true } }
    AiTurnRequest:
      type: object
      required: [contents]
      properties:
        system: { type: string }
        contents:
          type: array
          maxItems: 120
          items:
            type: object
            required: [role, parts]
            properties: { role: { type: string, enum: [user, model] }, parts: { type: array, items: { $ref: "#/components/schemas/AiPart" } } }
        tools:
          type: array
          maxItems: 64
          items:
            type: object
            required: [name, description]
            properties: { name: { type: string }, description: { type: string }, parameters: { type: object, additionalProperties: true, description: JSON Schema } }
        tool_mode: { type: string, enum: [AUTO, ANY, NONE] }
        allowed_tools: { type: array, items: { type: string } }
        json_schema: { type: object, additionalProperties: true }
        model: { type: string, description: "Bỏ qua: máy chủ dùng model đã cấu hình" }
    AiTurnResponse:
      type: object
      required: [id, parts]
      properties:
        id: { type: string }
        model: { type: string }
        parts: { type: array, items: { $ref: "#/components/schemas/AiPart" } }
        finish_reason: { type: string }
        usage: { type: object, properties: { input_tokens: { type: integer }, output_tokens: { type: integer }, total_tokens: { type: integer } } }
    ClientId:
      type: string
      pattern: "^[a-z0-9-]{1,64}$"
    Vnd:
      type: integer
      format: int64
      minimum: 0
      description: Số tiền tính bằng đồng
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, validation_failed, unauthenticated, app_check_failed, forbidden, reauth_required, not_found,
                 conflict, receipt_conflict, possible_duplicate, payload_too_large, unsupported_media,
                 quota_exceeded, rate_limited, receipt_unreadable, ai_unavailable, not_implemented, internal, timeout,
                 mandate_blocked, approval_required, invalid_state, payment_failed, payment_not_enabled, payment_unavailable,
                 too_many_images, image_too_large, unreadable_image, no_items, read_failed, invalid_purchase_date,
                 invalid_line_total, invalid_quantity, transaction_conflict,
                 idempotency_in_flight, idempotency_mismatch]
        retryable: { type: boolean, description: "true: thử lại cùng yêu cầu có thể thành công (lỗi tạm thời, xung đột transaction)" }
        message: { type: string, description: "Câu tiếng Việt ngắn, an toàn để hiển thị" }
        fields: { type: object, additionalProperties: true }
    Settings:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 40 }
        lead_days: { type: integer, minimum: 1, maximum: 30 }
        remind_enabled: { type: boolean }
        remind_freq: { type: string }
        digest_time: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        timezone: { type: string, default: Asia/Ho_Chi_Minh }
        channels: { type: array, items: { type: string, enum: [in_app, email] } }
        replacement_enabled: { type: boolean }
        sale_enabled: { type: boolean }
        lang: { type: string, enum: [vi, en], description: "Ngôn ngữ của tài khoản: giao diện, tên món dịch, lời nhắc, email. Vắng khi người mới chưa ghi; app ghi theo ngôn ngữ điện thoại" }
        country: { type: string, enum: [VN, US, SG], description: "Nước để lấy giá online. Cài đặt cho chọn VN, US; SG vẫn nhận. Vắng: đoán theo múi giờ (múi giờ Mỹ là US, Asia/Singapore là SG, còn lại VN)" }
        currency: { type: string, enum: [VND, USD], description: "Tiền tệ hiển thị của người này. Vắng: VND. Số tiền vẫn lưu bằng VND, chỉ quy đổi lúc hiển thị" }
        relations:
          type: object
          maxProperties: 50
          description: "Tên gọi người nhà theo uid, riêng từng tài khoản. PUT chỉ gửi phần đổi; \"\" là xóa"
          additionalProperties: { type: string, enum: [anh, chi, em, bo, me, con, ong, ba, khac, ""] }
        monthly_budget_vnd: { type: integer, format: int64, minimum: 0, maximum: 1000000000, description: "Ngân sách chi mỗi tháng, bằng đồng. PUT 0 là bỏ ngân sách; vắng là chưa đặt" }
    Profile:
      type: object
      properties:
        uid: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [owner, member] }
        household_id: { type: string }
        receipt_count: { type: integer }
        settings: { $ref: "#/components/schemas/Settings" }
    HomeSummary:
      type: object
      properties:
        spent_this_month: { oneOf: [{ $ref: "#/components/schemas/Vnd" }, { type: "null" }] }
        needs_count: { type: integer }
        plan: { type: object, properties: { item_count: { type: integer }, estimate: { oneOf: [{ $ref: "#/components/schemas/Vnd" }, { type: "null" }] }, missing_price: { type: integer } } }
        receipt_count: { type: integer }
        unread_notifications: { type: integer }
    DraftLine:
      type: object
      properties:
        line_id: { type: string }
        name: { type: string }
        qty: { type: number }
        unit: { type: string, description: "Đơn vị gốc đã chuẩn hóa: g, ml hoặc pc" }
        discount: { type: boolean, description: "Dòng khuyến mãi (số âm), không thành món" }
        amount: { type: string, description: Nguyên văn trên hóa đơn }
        amount_vnd: { oneOf: [{ $ref: "#/components/schemas/Vnd" }, { type: "null" }] }
        category_key: { type: string, description: Rỗng thì hiện nút Chọn nhóm }
        group_key: { type: string }
        habit: { type: boolean }
    Draft:
      type: object
      properties:
        receipt_id: { $ref: "#/components/schemas/ClientId" }
        store: { type: string }
        purchased_on: { type: string, format: date }
        currency: { type: string }
        total_printed: { type: string }
        discount_total: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/DraftLine" } }
        sum_vnd: { $ref: "#/components/schemas/Vnd" }
        total_mismatch: { type: boolean }
        fx: { type: object, properties: { rate: { type: string }, source: { type: string }, at: { type: string, format: date-time } } }
        fx_missing: { type: boolean, description: Chưa có tỷ giá có nguồn; dòng ngoại tệ không cộng vào chi tiêu }
        pages: { type: integer }
        unreadable_pages: { type: integer }
    SaveReceipt:
      type: object
      additionalProperties: false
      required: [receipt_id, purchased_on, lines]
      properties:
        receipt_id: { $ref: "#/components/schemas/ClientId" }
        store: { type: string }
        purchased_on: { type: string, format: date }
        currency: { type: string, default: VND }
        discount_total: { type: string }
        use_for_prediction: { type: boolean, default: true }
        confirm_duplicate: { type: boolean, default: false }
        lines:
          type: array
          minItems: 1
          maxItems: 150
          items:
            type: object
            additionalProperties: false
            required: [name, qty, amount]
            properties:
              line_id: { type: string }
              name: { type: string, maxLength: 120 }
              qty: { type: number, exclusiveMinimum: 0, maximum: 1000 }
              unit: { type: string }
              amount: { type: string }
              category_key: { type: string }
              group_key: { type: string, description: "Nhóm 0.2; người dùng bấm Chọn nhóm thì danh mục chi tiêu lấy theo nhóm" }
              habit: { type: boolean, description: "Tại nhà (true) hay Chuyến đi (false)" }
              raw_name: { type: string, description: "Kết quả chuẩn hóa lúc đọc (1.1), gửi lại nguyên vẹn" }
              brand: { type: string }
              product_name: { type: string }
              source_language: { type: string }
              original_name: { type: string, maxLength: 120, description: "Tên theo bill khi name là tên đã dịch sang ngôn ngữ app; gửi lại nguyên vẹn" }
              package_count: { type: number }
              package_size: { type: number }
              package_unit: { type: string }
              plans:
                type: array
                maxItems: 11
                description: "B3: Kế hoạch mà dòng trừ vào, theo thứ tự đã chia; vắng thì theo source_plan_id, mảng rỗng là không trừ"
                items: { type: object, additionalProperties: false, properties: { plan_id: { type: string }, qty: { type: number, minimum: 0 } } }
              price_source: { type: string, enum: [receipt, manual, estimate], description: "B7: nguồn giá; vắng là receipt. Dòng không có giá luôn lưu là missing. Giá trị online để dành cho giá quét online (bước 13)" }
    SaveResult:
      type: object
      properties:
        receipt_id: { type: string }
        status: { type: string, enum: [saved] }
        replayed: { type: boolean }
        plan_done: { type: array, items: { type: string } }
        recurring_matched: { type: array, items: { type: string } }
        split_plan:
          type: object
          description: "B6: món chưa mua của Kế hoạch vừa chốt đã sang Kế hoạch mới \"[tên cũ] · còn lại\" (giữ biểu tượng, nơi mua; chưa có ngày, chưa có người mua)"
          properties:
            from_plan_id: { type: string }
            plan_id: { type: string }
            name: { type: string }
            moved: { type: integer }
    Item:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        category_key: { type: string }
        status: { $ref: "#/components/schemas/StockStatus" }
        days_left: { oneOf: [{ type: integer, minimum: 0 }, { type: "null" }] }
        predicted_out_on: { type: string, format: date }
        interval_days: { type: integer }
        purchase_count: { type: integer }
        confidence: { type: string, enum: [low, mid, high] }
        source: { type: string, enum: [predicted, manual] }
        stock: { $ref: "#/components/schemas/Stock" }
    Stock:
      type: object
      description: "Confirmed Inventory (có bằng chứng) và Estimated Inventory (Mimi ước tính), cùng đơn vị gốc"
      properties:
        estimated: { type: number }
        unit: { type: string, enum: [g, ml, pc] }
        confirmed: { type: number }
        confirmed_on: { type: string, format: date }
        confirmed_source: { type: string, enum: [receipt, delivery, manual] }
        rate_per_day: { type: number }
        days_of_stock: { type: number }
        parts:
          type: array
          description: "Món gộp nhiều đơn vị (vd. hộp và gram): tồn kho từng phần"
          items:
            type: object
            properties:
              estimated: { type: number }
              unit: { type: string, enum: [g, ml, pc] }
              confirmed: { type: number }
              confirmed_on: { type: string, format: date }
              days_of_stock: { type: integer }
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            history:
              type: array
              maxItems: 10
              description: Mới nhất trước
              items:
                type: object
                properties:
                  on: { type: string, format: date }
                  store: { type: string }
                  amount_vnd: { oneOf: [{ $ref: "#/components/schemas/Vnd" }, { type: "null" }] }
                  receipt_id: { type: string }
    SharedItem:
      type: object
      description: Dạng rút gọn cho thành viên nhà. Không có trường giá.
      properties:
        key: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/StockStatus" }
        days_left: { oneOf: [{ type: integer }, { type: "null" }] }
    StockStatus:
      type: string
      enum: [out, buy_now, soon, upcoming, plenty, waiting]
    StockChange:
      type: object
      additionalProperties: false
      required: [acted_at]
      properties:
        quick: { type: string, enum: [plenty, soon, out] }
        days: { type: integer, minimum: 1, maximum: 60 }
        acted_at: { type: string, format: date-time, description: Lúc người dùng bấm (để xếp thứ tự thao tác offline) }
    Spending:
      type: object
      properties:
        month: { type: string }
        spent: { $ref: "#/components/schemas/Vnd" }
        spent_prev_month_pct: { type: [number, "null"], description: "Phần trăm so với tháng trước; null khi tháng trước chưa có chi tiêu" }
        spent_prev_same_range_pct: { type: [number, "null"], description: "Chỉ tháng hiện tại: phần trăm so với cùng khoảng ngày (1 đến same_range_day) tháng trước, tính trên hóa đơn quét và phần người nhà mua hộ. null khi tháng trước chưa có hóa đơn trong khoảng đó hoặc không phải tháng hiện tại" }
        same_range_day: { type: integer, minimum: 1, maximum: 31, description: "Ngày cuối của khoảng so cùng kỳ (hôm nay theo giờ Việt Nam). Vắng ở tháng cũ" }
        saved: { $ref: "#/components/schemas/Vnd" }
        saved_ratio: { type: [number, "null"], description: "discount / (spent + discount); null khi không có discount" }
        receipt_count: { type: integer }
        online_spent: { $ref: "#/components/schemas/Vnd" }
        online_orders: { type: integer }
        refunded: { $ref: "#/components/schemas/Vnd" }
        delegated_spent: { $ref: "#/components/schemas/Vnd", description: "Phần người nhà mua hộ cho mình, đã nằm trong spent" }
        by_category: { type: array, items: { type: object, properties: { key: { type: string }, amount: { $ref: "#/components/schemas/Vnd" }, pct: { type: number } } } }
        top_saving_receipts: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/ReceiptSummary" } }
        recent_receipts: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ReceiptSummary" } }
    ReceiptSummary:
      type: object
      properties:
        receipt_id: { type: string }
        store: { type: string }
        purchased_on: { type: string, format: date }
        total_vnd: { $ref: "#/components/schemas/Vnd" }
        discount_vnd: { $ref: "#/components/schemas/Vnd" }
        delegated: { type: boolean, description: "Phần người nhà mua hộ (receipt_id dạng d-{id}); total_vnd chỉ gồm món của mình" }
    Forecast:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { $ref: "#/components/schemas/Vnd" }
