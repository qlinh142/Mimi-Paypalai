# CI của Mimi (vấn đề 71, 95): mỗi lần đẩy code hoặc mở PR đều chạy test backend,
# kiểm tra kiểu và build frontend, và quét bí mật lỡ commit vào Git.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  # Test chạm Firestore thật (transaction, query, xóa đệ quy) chạy trên emulator. Không có
  # FIRESTORE_EMULATOR_HOST thì các test này tự bỏ qua, nên job backend ở trên không thấy chúng.
  emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta,cloud-firestore-emulator
      - name: Start Firestore emulator
        run: |
          gcloud beta emulators firestore start --host-port=127.0.0.1:8085 > /tmp/emulator.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:8085 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/emulator.log
          exit 1
      - run: go test -count=1 ./internal/gcp/fsstore/
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          GOOGLE_CLOUD_PROJECT: mimi-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # A3: kiểu sinh từ OpenAPI phải khớp bản đã commit. Lệch nghĩa là ai đó sửa
      # backend/api/openapi.yaml mà chưa chạy `npm run gen:api` (hoặc file YAML hỏng).
      - run: npm run gen:api
      - run: git diff --exit-code -- src/api/schema.d.ts
      # build chạy tsc, gồm src/api/contract.ts so tên trường giữa types.ts và OpenAPI.
      - run: npm run build
      # Kịch bản demo chạy trên bản thử (dữ liệu mẫu): quét bill → Đồ dùng → Sổ chi tiêu → Kế hoạch.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        # gitleaks-action đọc danh sách commit của PR qua API nên cần quyền đọc pull request.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
